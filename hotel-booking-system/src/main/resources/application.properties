# ===========================================
# НАЛАШТУВАННЯ СЕРВЕРА
# ===========================================
server.port=8080

# ===========================================
# НАЛАШТУВАННЯ БАЗИ ДАНИХ H2
# ===========================================
# H2 - це вбудована база даних, яка працює в пам'яті
# Ідеально підходить для навчання та тестування

spring.datasource.url=jdbc:h2:mem:hoteldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Увімкнути веб-консоль H2 (доступна за адресою /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================================
# НАЛАШТУВАННЯ JPA/HIBERNATE
# ===========================================
# Hibernate автоматично створює таблиці на основі entity-класів
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# НАЛАШТУВАННЯ JWT
# ===========================================
# Секретний ключ для підпису токенів (мінімум 256 біт для HS256)
jwt.secret=MySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong12345
# Час життя токена в мілісекундах (24 години)
jwt.expiration=86400000

# ===========================================
# ЛОГУВАННЯ
# ===========================================
logging.level.com.hotel=DEBUG
logging.level.org.springframework.security=DEBUG
